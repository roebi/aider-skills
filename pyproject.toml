[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aider-skills"
version = "0.1.0"
description = "Agent Skills integration for aider - inject skills into your AI pair programming sessions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Robert Halter", email = "roebi@users.noreply.github.com" }
]
keywords = ["aider", "aider-chat", "agent-skills", "llm", "ai", "coding-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0"
    # Wrap skills-ref for spec-compliant discovery
    # "skills-ref @ git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
aider-skills = "aider_skills.cli:main"

[project.urls]
Homepage = "https://github.com/roebi/aider-skills"
Documentation = "https://github.com/roebi/aider-skills/blob/main/docs/aider-integration.md"
Issues = "https://github.com/roebi/aider-skills/issues"
Changelog = "https://github.com/roebi/aider-skills/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aider_skills"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aider_skills --cov-report=term-missing"
